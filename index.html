<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fauji Kiryana - Voice Billing & Sales Tracker</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2, h3 { text-align: center; color: #1e3c72; margin-top: 0; }
    
    .voice-btn { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .voice-btn.listening { background: #dc3545; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .status-box { background: #eef2f7; padding: 10px; border-radius: 6px; font-size: 14px; color: #555; text-align: center; margin-bottom: 15px; min-height: 20px; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px 6px; text-align: left; }
    th { background-color: #f8f9fa; color: #495057; }
    .remove-btn { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }

    .manual-inputs { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 5px; margin-bottom: 15px; }
    .manual-inputs input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .add-btn { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .summary-box { background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
    .summary-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 4px; }

    .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn { padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-print { background: #17a2b8; }
    .btn-wa { background: #25d366; }
    .btn-clear { background: #6c757d; grid-column: span 2; }

    .dashboard { background: #e9ecef; border-radius: 8px; padding: 15px; margin-top: 25px; border: 1px solid #dee2e6; }
    .dash-cards { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .card { flex: 1; background: white; padding: 12px; border-radius: 6px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card h4 { margin: 0 0 5px 0; font-size: 13px; color: #6c757d; }
    .card .amount { font-size: 18px; font-weight: bold; color: #28a745; }
    .card .cost { font-size: 18px; font-weight: bold; color: #007bff; }

    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; font-family: monospace; font-size: 12px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🛒 Kiryana Voice Billing</h2>
  
  <button id="voiceBtn" class="voice-btn no-print" onclick="toggleVoice()">
    🎤 Tap to Speak
  </button>
  
  <div id="status" class="status-box no-print">Say: "2 kilo cheeni" or "1 kilo atta"</div>

  <!-- Manual Entry -->
  <div class="manual-inputs no-print">
    <input type="text" id="manualItem" placeholder="Item">
    <input type="number" id="manualQty" placeholder="Qty">
    <input type="number" id="manualCost" placeholder="Cost Price">
    <input type="number" id="manualPrice" placeholder="Selling Price">
    <button class="add-btn" onclick="addManualItem()">Add</button>
  </div>

  <!-- Bill Receipt -->
  <div id="printable-receipt">
    <h3 style="text-align: center; margin: 0;">Fauji Kiryana Store</h3>
    <p style="text-align: center; margin: 5px 0;" id="billDate"></p>
    <hr style="border-top: 1px dashed #000;">

    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Rate</th>
          <th>Total</th>
          <th class="no-print"></th>
        </tr>
      </thead>
      <tbody id="cartTable"></tbody>
    </table>

    <hr style="border-top: 1px dashed #000;">
    <div class="summary-box">
      <div class="summary-row">
        <span>Grand Total:</span>
        <span id="grandTotal">Rs. 0</span>
      </div>
    </div>
    <p style="text-align: center; margin-top: 10px;">Thank You! Visit Again 🙏</p>
  </div>

  <!-- Action Buttons -->
  <div class="action-btns no-print">
    <button class="btn btn-print" onclick="completeAndPrint()">🖨️ Print & Save Sale</button>
    <button class="btn btn-wa" onclick="shareWhatsApp()">📱 WhatsApp Bill</button>
    <button class="btn btn-clear" onclick="clearCart()">🗑️ Clear Cart</button>
  </div>

  <!-- Daily Sales & Profit Dashboard -->
  <div class="dashboard no-print">
    <h3>📊 Daily Sales & Profit Summary</h3>
    <div class="dash-cards">
      <div class="card">
        <h4>Today's Sales</h4>
        <div class="amount" id="dashRevenue">Rs. 0</div>
      </div>
      <div class="card">
        <h4>Today's Net Profit</h4>
        <div class="cost" id="dashProfit">Rs. 0</div>
      </div>
    </div>
    <button onclick="resetDailySales()" style="width:100%; padding: 8px; background: #dc3545; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">🔄 Reset Today's Sales Counter</button>
  </div>
</div>

<script>
  // Strictly English and Roman Urdu Database
  // Format: "key": [Selling Price, Cost Price, Display Name]
  const productDB = {
    "cheeni": [150, 140, "CHEENI"], "sugar": [150, 140, "CHEENI"],
    "atta": [120, 110, "ATTA"], "aata": [120, 110, "ATTA"], "flour": [120, 110, "ATTA"],
    "chawal": [280, 250, "RICE"], "rice": [280, 250, "RICE"],
    "doodh": [200, 180, "DOODH"], "milk": [200, 180, "DOODH"],
    "tel": [500, 470, "OIL"], "oil": [500, 470, "OIL"], "ghee": [500, 470, "GHEE"],
    "dal": [280, 250, "DAL"], "daal": [280, 250, "DAL"],
    "sabun": [100, 85, "SOAP"], "soap": [100, 85, "SOAP"],
    "chai": [300, 270, "TEA"], "tea": [300, 270, "TEA"]
  };

  const wordToNum = {
    "ek": 1, "ik": 1, "one": 1,
    "do": 2, "two": 2,
    "teen": 3, "three": 3,
    "chaar": 4, "four": 4,
    "paanch": 5, "panch": 5, "five": 5,
    "che": 6, "chey": 6, "six": 6,
    "saat": 7, "seven": 7,
    "aath": 8, "eight": 8,
    "nau": 9, "nine": 9,
    "das": 10, "ten": 10
  };

  let cart = [];
  let isListening = false;
  let recognition;

  let dailyRevenue = parseFloat(localStorage.getItem("fauji_daily_revenue")) || 0;
  let dailyProfit = parseFloat(localStorage.getItem("fauji_daily_profit")) || 0;

  window.onload = () => {
    updateDashDisplay();
  };

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'en-US'; // English Recognition Engine for Roman Speech

    recognition.onresult = (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
      document.getElementById('status').innerText = `Heard: "${transcript}"`;
      parseVoiceCommand(transcript);
    };

    recognition.onerror = () => {
      document.getElementById('status').innerText = "Error listening. Try again.";
      stopListening();
    };
  } else {
    document.getElementById('status').innerText = "Voice API not supported on this browser. Use Chrome.";
  }

  function toggleVoice() {
    if (!recognition) return;
    if (isListening) {
      stopListening();
    } else {
      recognition.start();
      isListening = true;
      document.getElementById('voiceBtn').classList.add('listening');
      document.getElementById('voiceBtn').innerText = "🛑 Stop Listening";
      document.getElementById('status').innerText = "Listening... Speak item name & qty.";
    }
  }

  function stopListening() {
    if (recognition) recognition.stop();
    isListening = false;
    document.getElementById('voiceBtn').classList.remove('listening');
    document.getElementById('voiceBtn').innerText = "🎤 Tap to Speak";
  }

  function parseVoiceCommand(text) {
    if (text.includes("print") || text.includes("bill")) {
      completeAndPrint();
      return;
    }

    const words = text.split(" ");
    let qty = 1;
    let foundKey = "";

    words.forEach(word => {
      const cleanWord = word.replace(/[^0-9]/g, '');
      if (cleanWord && !isNaN(parseInt(cleanWord))) {
        qty = parseInt(cleanWord);
      } else if (wordToNum[word]) {
        qty = wordToNum[word];
      }
      
      if (productDB[word]) {
        foundKey = word;
      }
    });

    if (foundKey) {
      const sellPrice = productDB[foundKey][0];
      const costPrice = productDB[foundKey][1];
      const displayName = productDB[foundKey][2];
      addToCart(displayName, qty, sellPrice, costPrice);
    } else {
      document.getElementById('status').innerText = `Item "${text}" not found. Try saying "1 kilo cheeni" or "5 oil".`;
    }
  }

  function addToCart(name, qty, price, cost) {
    const existing = cart.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (existing) {
      existing.qty += qty;
    } else {
      cart.push({ name: name.toUpperCase(), qty, price, cost });
    }
    renderCart();
  }

  function addManualItem() {
    const name = document.getElementById('manualItem').value;
    const qty = parseFloat(document.getElementById('manualQty').value) || 1;
    const cost = parseFloat(document.getElementById('manualCost').value) || 0;
    const price = parseFloat(document.getElementById('manualPrice').value) || 0;

    if (!name || price <= 0) return alert("Enter valid Item Name and Selling Price!");
    addToCart(name, qty, price, cost);

    document.getElementById('manualItem').value = '';
    document.getElementById('manualQty').value = '';
    document.getElementById('manualCost').value = '';
    document.getElementById('manualPrice').value = '';
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function clearCart() {
    cart = [];
    renderCart();
  }

  function renderCart() {
    const table = document.getElementById('cartTable');
    table.innerHTML = '';
    let grandTotal = 0;

    cart.forEach((item, i) => {
      const total = item.qty * item.price;
      grandTotal += total;
      table.innerHTML += `
        <tr>
          <td>${item.name}</td>
          <td>${item.qty}</td>
          <td>Rs. ${item.price}</td>
          <td>Rs. ${total}</td>
          <td class="no-print"><button class="remove-btn" onclick="removeItem(${i})">X</button></td>
        </tr>
      `;
    });

    document.getElementById('grandTotal').innerText = `Rs. ${grandTotal}`;
    document.getElementById('billDate').innerText = new Date().toLocaleString('en-PK');
  }

  function completeAndPrint() {
    if (cart.length === 0) return alert("Cart is empty!");

    let billRevenue = 0;
    let billCost = 0;

    cart.forEach(item => {
      billRevenue += (item.qty * item.price);
      billCost += (item.qty * item.cost);
    });

    let billProfit = billRevenue - billCost;

    dailyRevenue += billRevenue;
    dailyProfit += billProfit;

    localStorage.setItem("fauji_daily_revenue", dailyRevenue);
    localStorage.setItem("fauji_daily_profit", dailyProfit);

    updateDashDisplay();
    window.print();
  }

  function updateDashDisplay() {
    document.getElementById('dashRevenue').innerText = `Rs. ${dailyRevenue}`;
    document.getElementById('dashProfit').innerText = `Rs. ${dailyProfit}`;
  }

  function resetDailySales() {
    if (confirm("Reset today's sales and profit counters to zero?")) {
      dailyRevenue = 0;
      dailyProfit = 0;
      localStorage.setItem("fauji_daily_revenue", 0);
      localStorage.setItem("fauji_daily_profit", 0);
      updateDashDisplay();
    }
  }

  function shareWhatsApp() {
    if (cart.length === 0) return alert("Cart is empty!");
    let msg = "*-- Fauji Kiryana Store Bill --*\n\n";
    let grandTotal = 0;
    cart.forEach(i => {
      const tot = i.qty * i.price;
      grandTotal += tot;
      msg += `${i.name} - ${i.qty} x Rs. ${i.price} = Rs. ${tot}\n`;
    });
    msg += `\n*Total Amount: Rs. ${grandTotal}*\n`;
    msg += "Thank you for shopping!";

    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>
</body>
</html>
